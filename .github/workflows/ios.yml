name: iOS App

# 健康紀錄 App 有更新時，在 macOS 上編譯 iPhone 版，並把未簽章的 .ipa 發佈到 Releases 的「ios-latest」
# （用 Sideloadly／AltStore 以自己的 Apple ID 簽章安裝；說明見 health-mobile/README.md）
on:
  push:
    branches: [main, claude/health-info-tracking-app-w5cf5u]
    paths:
      - 'health-tracker/**'
      - 'health-mobile/**'
      - '!health-mobile/android/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: health-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: health-mobile/package-lock.json

      - name: 安裝套件並複製網頁
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: 編譯 iPhone 版
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E '(error|warning: .*HealthKit|BUILD (SUCCEEDED|FAILED))' || true
          test -d "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app" || { tail -80 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }

      - name: 打包 .ipa（臨時簽章並帶入 HealthKit 權限，安裝時會以你的 Apple ID 重新簽章）
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app"
          find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - --timestamp=none {} \; 2>/dev/null || true
          codesign --force --sign - --timestamp=none --entitlements ios/App/App/App.entitlements "$APP"
          codesign -d --entitlements - "$APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry "../health-tracker-ios-${{ github.run_number }}.ipa" Payload)
          ls -lh health-tracker-ios-*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: health-tracker-ipa
          path: health-mobile/health-tracker-ios-*.ipa

      - name: 發佈到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest health-tracker-ios-*.ipa \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "健康紀錄 iPhone 版（第 ${{ github.run_number }} 版）" \
            --notes "從 ${GITHUB_REF_NAME} 分支自動編譯（${GITHUB_SHA::7}）。這是未經 App Store 簽章的 .ipa，需要用 Sideloadly 或 AltStore 以你的 Apple ID 簽章後安裝，詳見 health-mobile/README.md。"

      # ---- 以下只有在設定好 App Store Connect 的 Secrets 後才會執行（見 health-mobile/store/README.md）----
      - name: 檢查是否已設定 App Store Connect 金鑰
        id: asc
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$ASC_KEY_P8" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "未設定 ASC_KEY_P8，略過上傳 TestFlight"; fi

      - name: 簽章並上傳到 TestFlight
        if: steps.asc.outputs.enabled == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            "${AUTH[@]}" | tail -40
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -40
          rm -f "$KEY"
